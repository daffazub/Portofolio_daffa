<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="iot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="50%" stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#iot-bg)" rx="10" />
  <!-- Microcontroller Board Motif -->
  <rect x="245" y="75" width="110" height="130" rx="8" fill="#1b2a32" stroke="#00C853" stroke-width="2" />
  <!-- Camera Module -->
  <circle cx="300" cy="120" r="28" fill="#111" stroke="#444" stroke-width="3" />
  <circle cx="300" cy="120" r="16" fill="url(#lens)" />
  <circle cx="295" cy="115" r="5" fill="#ffffff" opacity="0.6" />
  <!-- Pins / Circuit traces -->
  <line x1="235" y1="95" x2="245" y2="95" stroke="#FFD700" stroke-width="3" />
  <line x1="235" y1="110" x2="245" y2="110" stroke="#FFD700" stroke-width="3" />
  <line x1="235" y1="125" x2="245" y2="125" stroke="#FFD700" stroke-width="3" />
  <line x1="235" y1="140" x2="245" y2="140" stroke="#FFD700" stroke-width="3" />
  <line x1="355" y1="95" x2="365" y2="95" stroke="#FFD700" stroke-width="3" />
  <line x1="355" y1="110" x2="365" y2="110" stroke="#FFD700" stroke-width="3" />
  <line x1="355" y1="125" x2="365" y2="125" stroke="#FFD700" stroke-width="3" />
  <line x1="355" y1="140" x2="365" y2="140" stroke="#FFD700" stroke-width="3" />
  <!-- Waves / Detection -->
  <path d="M260 60 Q 300 45 340 60" fill="none" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4" />
  <text x="300" y="245" font-family="'Poppins', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">ESP32-CAM IoT</text>
  <text x="300" y="280" font-family="'Poppins', sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.9)" text-anchor="middle">Sistem Pengusir Kerumunan Unggas Otomatis</text>
</svg>

